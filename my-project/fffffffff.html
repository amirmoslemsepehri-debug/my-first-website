<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeCodeCamp Offline</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#238636;}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0}
button{background:var(--green);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.1)}
#status{color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 60px)}
aside{border-right:1px solid var(--border);overflow:auto;padding:12px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:#fff;margin-bottom:10px}
.lesson{padding:10px;border-radius:8px;margin-bottom:4px;cursor:pointer}.lesson:hover,.lesson.active{background:#21262d}
article{overflow:auto;padding:28px;max-width:900px}pre{background:#161b22;padding:16px;border-radius:10px;overflow:auto;border:1px solid var(--border)}code{font-family:Consolas,monospace}img{max-width:100%;border-radius:10px}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}table{border-collapse:collapse;width:100%;margin:20px 0}th,td{border:1px solid var(--border);padding:8px;text-align:left}blockquote{border-left:4px solid var(--accent);padding-left:12px;color:#b3c0cf}h1,h2,h3,h4{color:#fff}
</style>
</head>
<body>
<header>
<h3 style="margin:0">🏕️ FreeCodeCamp Offline</h3>
<button id="pick">Choose FreeCodeCamp Folder</button>
<div id="status">No folder selected</div>
</header>
<main>
<aside>
<input id="search" placeholder="Search lessons..." disabled>
<div id="list"></div>
</aside>
<article id="viewer">
<h1>Welcome</h1>
<p>Select the extracted <b>freeCodeCamp</b> folder.</p>
</article>
</main>
<script>
let lessons=[];let rootDir=null;const list=document.getElementById('list');const viewer=document.getElementById('viewer');const search=document.getElementById('search');const status=document.getElementById('status');
async function findCurriculum(dir){if(dir.name==='curriculum')return dir;for await(const[,h]of dir.entries()){if(h.kind==='directory'){const f=await findCurriculum(h);if(f)return f}}return null}
async function scan(dir,path=''){for await(const[name,h]of dir.entries()){if(h.kind==='directory')await scan(h,path+'/'+name);else if(name.endsWith('.md'))lessons.push({name,path:path+'/'+name,handle:h})}}
document.getElementById('pick').onclick=async()=>{try{rootDir=await window.showDirectoryPicker();const curriculum=await findCurriculum(rootDir);if(!curriculum){alert('Folder must contain a curriculum folder.');return}lessons=[];status.textContent='Scanning lessons...';await scan(curriculum,'curriculum');lessons.sort((a,b)=>a.path.localeCompare(b.path));status.textContent=lessons.length+' lessons loaded';search.disabled=false;render('')}catch(e){}};
function render(q){list.innerHTML='';lessons.filter(l=>(l.name+l.path).toLowerCase().includes(q)).forEach(l=>{const d=document.createElement('div');d.className='lesson';d.textContent=l.name;d.onclick=()=>openLesson(l,d);list.appendChild(d)})}
search.oninput=e=>render(e.target.value.toLowerCase());
async function openLesson(file,el){document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('active'));el.classList.add('active');const txt=await(await file.handle.getFile()).text();viewer.innerHTML='<small style="color:#8b949e">'+file.path+'</small>'+markdown(txt)}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function markdown(md){let blocks=[];md=md.replace(/```([\s\S]*?)```/g,(m,c)=>{blocks.push('<pre><code>'+esc(c.trim())+'</code></pre>');return '@@'+(blocks.length-1)+'@@'});md=esc(md);md=md.replace(/^#### (.*)$/gm,'<h4>$1</h4>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');md=md.replace(/!\[(.*?)\]\((.*?)\)/g,'<img alt="$1" src="$2">');md=md.replace(/\[(.*?)\]\((.*?)\)/g,'<a href="$2" target="_blank">$1</a>');md=md.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');md=md.replace(/`([^`]+)`/g,'<code>$1</code>');md=md.replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>');md=md.replace(/^(?:- |\* )(.*)$/gm,'<li>$1</li>');md=md.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');md=md.replace(/^\|(.+)\|$/gm,m=>m);let html=md.split(/\n\n+/).map(p=>/^(<h|<pre|<ul|<blockquote|<table)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');blocks.forEach((b,i)=>html=html.replace('@@'+i+'@@',b));return html}
</script>
</body>
</html>
